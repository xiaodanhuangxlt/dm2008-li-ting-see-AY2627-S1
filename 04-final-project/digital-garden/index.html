<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Where Flowers Bloom</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/style.css" />
  <script src="js/helper.js"></script>
  <script src="js/p5.min.js"></script>
  <script src="js/p5.sound.min.js"></script>
  <style>
    html,
    body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      /*keeps video proportions and crops wtv that doesnt fit
      centerd view*/
      z-index: 0;
    }

    /*canvas sits on top of the video and it is tranparent*/
    canvas {
      position: fixed;
      inset: 0;
      display: block;
      z-index: 1;
    }
  </style>
</head>

<body>
  <!-- always load sketch.js first -->
  <script src="sketch.js"></script>
  <!-- Add any additional js files below this -->
  <script src="js/soil.js"></script>
  <script src="js/clock.js"></script>
  <script src="js/video.js"></script>
  <script src="js/plant.js"></script>
  <script src="js/tools.js"></script>
  <script src="js/assets.js"></script>
  <script src="js/effects.js"></script>
  <script src="js/hud.js"></script>


  <video id="bg" src="assets/garden.mp4" autoplay muted loop playsinline preload="auto"></video>
</body>

</html>
